spring.application.name=order-service
spring.cloud.openfeign.client.config.default.connectTimeout=1000
spring.cloud.openfeign.client.config.default.readTimeout=2000
resilience4j.circuitbreaker.instances.inventoryService.minimumNumberOfCalls=3
resilience4j.circuitbreaker.instances.inventoryService.slidingWindowSize=3
resilience4j.circuitbreaker.instances.inventoryService.failureRateThreshold=50
resilience4j.circuitbreaker.instances.inventoryService.waitDurationInOpenState=5s