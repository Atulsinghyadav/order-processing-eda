server:
  port: 8081

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/order_db
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

  properties:
    hibernate:
      dialect: org.hibernate.dialect.PostgreSQLDialect
