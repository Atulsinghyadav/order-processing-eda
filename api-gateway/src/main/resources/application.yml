server:
  port: 8080

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      routes:

        - id: order-service
          uri: http://localhost:8081
          predicates:
            - Path=/orders/**

        - id: inventory-service
          uri: http://localhost:8082
          predicates:
            - Path=/inventory/**

        - id: auth-service
          uri: ${AUTH_SERVICE_URL:http://localhost:8083}
          predicates:
              - Path=/auth/**

jwt:
  secret-key: ${JWT_SECRET:dev-secret-key-for-local-development-should-be-at-least-32-chars}
  expiration: 3600000